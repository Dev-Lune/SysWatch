<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Buy us a coffee — support SysWatch">
  <defs>
    <linearGradient id="card-bg-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand-stroke-c" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="icon-bg-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow-c" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow-c" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow-c)">
    <rect x="3" y="3" width="314" height="90" rx="20" ry="20" fill="url(#card-bg-c)" stroke="url(#brand-stroke-c)" stroke-width="1.5"/>
    <rect x="3" y="3" width="314" height="90" rx="20" ry="20" fill="url(#glow-c)"/>
  </g>

  <!-- Coffee cup icon tile -->
  <g transform="translate(16, 18)">
    <rect width="60" height="60" rx="16" ry="16" fill="url(#icon-bg-c)"/>
    <g transform="translate(14, 14)" fill="none" stroke="#0B1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- cup body -->
      <path d="M4 14 L4 28 C4 31 6 33 9 33 L23 33 C26 33 28 31 28 28 L28 14 Z"/>
      <!-- handle -->
      <path d="M28 18 L31 18 C33 18 34 19 34 21 L34 23 C34 25 33 26 31 26 L28 26"/>
      <!-- steam -->
      <path d="M10 10 C10 8 12 8 12 6 C12 4 10 4 10 2"/>
      <path d="M16 10 C16 8 18 8 18 6 C18 4 16 4 16 2"/>
      <path d="M22 10 C22 8 24 8 24 6 C24 4 22 4 22 2"/>
    </g>
  </g>

  <g font-family="'Inter','Segoe UI','SF Pro Text',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
    <text x="92" y="38" fill="#FBCFE8" font-size="10" font-weight="700" letter-spacing="2.8">SUPPORT US</text>
    <text x="92" y="64" fill="#FFFFFF" font-size="22" font-weight="700">Buy a coffee</text>
  </g>

  <g transform="translate(284, 48)">
    <circle r="16" fill="#0B1020" stroke="#F472B6" stroke-opacity="0.55" stroke-width="1.1"/>
    <path d="M-3 -5.5 L3 0 L-3 5.5" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
