<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Star SysWatch on GitHub">
  <defs>
    <linearGradient id="card-bg-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand-stroke-s" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="icon-bg-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow-s" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow-s" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow-s)">
    <rect x="3" y="3" width="314" height="90" rx="20" ry="20" fill="url(#card-bg-s)" stroke="url(#brand-stroke-s)" stroke-width="1.5"/>
    <rect x="3" y="3" width="314" height="90" rx="20" ry="20" fill="url(#glow-s)"/>
  </g>

  <!-- Star icon tile -->
  <g transform="translate(16, 18)">
    <rect width="60" height="60" rx="16" ry="16" fill="url(#icon-bg-s)"/>
    <path d="M30 13 L34.8 24.2 L47 25.4 L37.8 33.8 L40.5 46 L30 39.6 L19.5 46 L22.2 33.8 L13 25.4 L25.2 24.2 Z" fill="#0B1020"/>
  </g>

  <g font-family="'Inter','Segoe UI','SF Pro Text',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
    <text x="92" y="38" fill="#FDE68A" font-size="10" font-weight="700" letter-spacing="2.8">STAR ON</text>
    <text x="92" y="64" fill="#FFFFFF" font-size="22" font-weight="700">GitHub</text>
  </g>

  <g transform="translate(284, 48)">
    <circle r="16" fill="#0B1020" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="1.1"/>
    <path d="M-3 -5.5 L3 0 L-3 5.5" fill="none" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
