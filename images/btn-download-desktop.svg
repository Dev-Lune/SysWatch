<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="Download desktop app — Windows, macOS, Linux">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand-stroke" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card -->
  <g filter="url(#soft-shadow)">
    <rect x="4" y="4" width="472" height="112" rx="22" ry="22" fill="url(#card-bg)" stroke="url(#brand-stroke)" stroke-width="1.5"/>
    <rect x="4" y="4" width="472" height="112" rx="22" ry="22" fill="url(#glow)"/>
  </g>

  <!-- Icon tile: brand gradient square with monitor -->
  <g transform="translate(24, 24)">
    <rect width="72" height="72" rx="18" ry="18" fill="url(#icon-bg)"/>
    <!-- Monitor glyph -->
    <g transform="translate(16, 18)" fill="none" stroke="#0B1020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="40" height="26" rx="3"/>
      <line x1="12" y1="34" x2="28" y2="34"/>
      <line x1="20" y1="26" x2="20" y2="34"/>
    </g>
  </g>

  <!-- Text block -->
  <g font-family="'Inter','Segoe UI','SF Pro Text',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
    <text x="118" y="46" fill="#67E8F9" font-size="11" font-weight="700" letter-spacing="3.2">DOWNLOAD</text>
    <text x="118" y="74" fill="#FFFFFF" font-size="24" font-weight="700">Desktop app</text>
    <text x="118" y="96" fill="#94A3B8" font-size="12" font-weight="500" letter-spacing="0.8">Windows  ·  macOS  ·  Linux</text>
  </g>

  <!-- Right chevron in circle -->
  <g transform="translate(428, 60)">
    <circle r="20" fill="#0B1020" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.2"/>
    <path d="M-4 -7 L4 0 L-4 7" fill="none" stroke="#A78BFA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
